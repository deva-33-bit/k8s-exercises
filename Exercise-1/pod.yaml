cat > Exercise-1/pod.yaml << 'EOF'
apiVersion: v1
kind: Pod
metadata:
  name: hello-k8s
  labels:
    run: hello-k8s
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80
EOF

cat > Exercise-1/service.yaml << 'EOF'
apiVersion: v1
kind: Service
metadata:
  name: hello-k8s
spec:
  type: NodePort
  selector:
    run: hello-k8s
  ports:
    - port: 80
      targetPort: 80
EOF